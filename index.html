<!doctype html>
<html lang="en">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇨🇷</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Help Joshua Go to Costa Rica</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style id="css">:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#E6F4F5;--card:#FFFFFF;--text:#0B2545;--muted:#3D5560;--line:#C5DDE0;--bar:#CFE3E6;--fill:#D93F4B;--claimed:#D3E4E7;--claimed-text:#3D5560;--input:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#052B31;--card:#0A3F48;--text:#EAF7F8;--muted:#B9D6DA;--line:#17606B;--bar:#0F5560;--fill:#FFC93C;--claimed:#0F5560;--claimed-text:#CFE8EC;--input:#062F36}}
:root[data-theme="dark"]{--bg:#052B31;--card:#0A3F48;--text:#EAF7F8;--muted:#B9D6DA;--line:#17606B;--bar:#0F5560;--fill:#FFC93C;--claimed:#0F5560;--claimed-text:#CFE8EC;--input:#062F36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,.big,.amt{font-family:'Lilita One','Poppins',system-ui,sans-serif;font-weight:400}
.hero{background:#087E8B;color:#fff;position:relative;overflow:hidden;border-radius:0 0 36px 36px;padding:28px 20px 56px}
.hero::before{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:#FF5A5F}
.hero::after{content:"";position:absolute;right:120px;top:22px;width:44px;height:44px;border-radius:50%;background:#FFC93C}
.hero-in{position:relative;z-index:1;max-width:720px;margin:0 auto}
.pill{display:inline-block;margin:0 0 14px;background:#FFC93C;color:#0B2545;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
h1{margin:0 0 18px;font-size:clamp(38px,9vw,60px);line-height:1.02;max-width:12em}
.intro{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.intro p{flex:1 1 260px;margin:0;font-size:17px;line-height:1.55}
.photo{width:150px;height:200px;object-fit:cover;border:6px solid #fff;border-radius:22px;transform:rotate(-2deg);box-shadow:8px 8px 0 #FFC93C;flex:none}
.wrap{max-width:760px;margin:-32px auto 0;padding:0 16px 40px;position:relative;z-index:2}
.card{background:var(--card);border-radius:28px;padding:22px 20px;margin:0 0 16px;border:1px solid var(--line)}
.card h2{margin:0 0 6px;font-size:30px;line-height:1.1}
.card p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{margin:0;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{margin:2px 0 12px;font-size:clamp(52px,14vw,84px);line-height:1}
.big .of{font-family:'Poppins',system-ui,sans-serif;font-size:clamp(16px,4vw,22px);font-weight:600;color:var(--muted)}
.bar{height:22px;border-radius:999px;background:var(--bar);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--fill);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 0!important}
.meta{margin:6px 0 0!important;font-size:13px;color:var(--muted);min-height:1.5em}
.grid{list-style:none;margin:14px 0 8px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sq{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:68px;padding:6px 4px;border:0;border-radius:16px;background:var(--c);color:#0B2545;text-align:center;font:inherit}
.sq .amt{font-size:24px;line-height:1.05}
.sq .tag{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;line-height:1.2}
.sq .chk{position:absolute;right:5px;top:5px;width:14px;height:14px}
.sq.given{background:var(--claimed);color:var(--claimed-text)}
.sq.given .amt{text-decoration:line-through;text-decoration-thickness:2px}
button.sq{cursor:pointer}
button.sq:focus-visible,.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.sq.sel{outline:3px solid var(--text);outline-offset:2px}
@media (min-width:640px){.grid{grid-template-columns:repeat(9,minmax(0,1fr))}.sq .amt{font-size:22px}}
.legend{display:flex;align-items:center;gap:8px;margin:10px 0 0!important;font-size:14px;color:var(--muted)}
.key{display:inline-block;width:16px;height:16px;border-radius:5px}
.key.open{background:#FFC93C}.key.given{background:var(--claimed);border:1px solid var(--line);margin-left:8px}
.give-in{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qr{width:200px;height:200px;background:#fff;padding:10px;border-radius:18px;flex:none}
.give-txt{flex:1 1 220px}
.handle{display:flex;flex-direction:column;margin:0 0 14px!important}
.handle strong{font-size:26px;line-height:1.2}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:16px;line-height:1.2;padding:12px 20px;min-height:44px;border-radius:999px;border:2px solid var(--text);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--text);color:var(--card)}
.btn.cash{background:#00873C;border-color:#00873C;color:#fff;margin-bottom:12px}
.owner{border-style:dashed;border-width:2px}
.editor{padding:14px;border-radius:18px;background:var(--bg);margin:0 0 14px}
.owner label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.owner input{font:inherit;font-size:16px;color:var(--text);background:var(--input);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;max-width:320px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row .pre{font-weight:700}
.other .row{margin-top:0}
.other input{width:140px}
.msg{margin:12px 0 0!important;font-weight:600}
footer{text-align:center;padding:8px 8px 0}
footer p{margin:0 0 6px}
.verse{font-family:'Lilita One','Poppins',system-ui,sans-serif;font-size:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}</style>
</head>

const HEAD_HTML = "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"color-scheme\" content=\"light dark\">\n<title>Help Joshua Go to Costa Rica</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;600;700&display=swap\" rel=\"stylesheet\">";
(function () {
  'use strict';
  var CASHTAG = '$AmandaHale3';
  var CASH_URL = 'https://cash.app/$AmandaHale3';
  var COLORS = ['#FFC93C', '#FF5A5F', '#FFFFFF', '#7BD66B', '#8ED8E0'];
  var root = document.getElementById('root');
  var state = JSON.parse(JSON.stringify(STATE));
  var ctx = { canEdit: false, artifact: null, selected: -1, busy: false, msg: '', animated: false };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return '$' + Number(n).toLocaleString('en-US'); }
  function clean(s) { return String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 24); }
  function totals(s) {
    var raised = s.other || 0, count = 0;
    s.squares.forEach(function (q) { if (q.c) { raised += q.a; count++; } });
    return { raised: raised, count: count };
  }

  function buildDoc(s) {
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('app').textContent;
    var re = /\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//;
    var block = '/*STATE' + '_START*/const STATE = ' + JSON.stringify(s).replace(/</g, '\\u003c') + ';/*STATE' + '_END*/';
    js = js.replace(re, function () { return block; });
    return '<!doctype html>\n<html lang="en">\n<head>\n' + HEAD_HTML + '\n<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n<script id="app">' + js + '<\/script>\n</body>\n</html>\n';
  }

  function updatedLine() {
    if (!state.updated) return '';
    var d = new Date(state.updated);
    if (isNaN(d.getTime())) return '';
    return 'Updated ' + d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function ownerPanel() {
    if (!ctx.canEdit) return '';
    var h = '<section class="card owner" aria-label="Owner tools"><h2>Owner tools</h2>' +
      '<p class="muted">Tap a square above to record a gift. Open pages refresh when you save.</p>';
    if (ctx.selected >= 0) {
      var q = state.squares[ctx.selected];
      h += '<div class="editor" id="editor" role="group" aria-label="Update the ' + money(q.a) + ' square">' +
        '<p><strong>' + money(q.a) + ' square</strong> &middot; ' + (q.c ? 'given' : 'open') + '</p>' +
        '<label for="who">Donor’s first name (optional, shown on this public page)</label>' +
        '<input id="who" maxlength="24" autocomplete="off" value="' + esc(q.n || '') + '">' +
        '<div class="row">' +
        (q.c
          ? '<button type="button" class="btn primary" data-act="save-name">Save name</button><button type="button" class="btn" data-act="reopen">Mark as open again</button>'
          : '<button type="button" class="btn primary" data-act="give">Mark as given</button>') +
        '<button type="button" class="btn" data-act="cancel">Cancel</button></div></div>';
    }
    h += '<div class="other"><label for="other">Other gifts total (amounts that aren’t a square)</label>' +
      '<div class="row"><span class="pre">$</span><input id="other" inputmode="numeric" autocomplete="off" value="' + (state.other || 0) + '">' +
      '<button type="button" class="btn" data-act="save-other">Save</button></div></div>';
    if (ctx.msg) h += '<p class="msg" role="status">' + esc(ctx.msg) + '</p>';
    return h + '</section>';
  }

  function render() {
    var t = totals(state);
    var goal = state.goal;
    var pct = Math.min(100, (t.raised / goal) * 100);
    var left = Math.max(0, goal - t.raised);
    var firstPaint = !ctx.animated;
    var h = '';
    h += '<header class="hero"><div class="hero-in">' +
      '<p class="pill">Costa Rica mission trip</p>' +
      '<h1>Help Joshua go to Costa Rica</h1>' +
      '<div class="intro"><img class="photo" src="' + PHOTO + '" alt="Joshua standing beside his truck" width="150" height="200">' +
      '<p>Joshua has an opportunity to serve the Lord through a mission trip with Strong Rock Christian School to Costa Rica. We are excited to see how God will use him to serve others. We’d love for family and friends to be part of this journey and support him through prayer and giving.</p></div>' +
      '</div></header><main class="wrap">';

    h += '<section class="card total" aria-label="Fundraising total"><p class="label">Raised so far</p>' +
      '<p class="big"><span id="raised">' + money(firstPaint ? 0 : t.raised) + '</span><span class="of"> of ' + money(goal) + '</span></p>' +
      '<div class="bar" role="progressbar" aria-label="Fundraising progress" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + Math.min(goal, t.raised) + '">' +
      '<div class="fill" id="fill" style="width:' + (firstPaint ? 0 : pct) + '%"></div></div>' +
      '<p class="stats"><span><strong>' + t.count + '</strong> of ' + state.squares.length + ' squares given</span>' +
      '<span>' + (left > 0 ? '<strong>' + money(left) + '</strong> to go' : '<strong>Goal reached. Thank you!</strong>') + '</span></p>' +
      '<p class="meta">' + esc(updatedLine()) + '</p></section>';

    h += '<section class="card"><h2>Claim a square</h2>' +
      '<p>Pick a square and give that exact amount. Every square is a different amount, so we’ll know which one is yours.</p><ul class="grid">';
    state.squares.forEach(function (q, i) {
      var col = COLORS[(Math.floor(i / 5) * 2 + (i % 5)) % 5];
      var cls = 'sq' + (q.c ? ' given' : '') + (ctx.selected === i ? ' sel' : '');
      var inner = '<span class="amt">' + money(q.a) + '</span>' +
        (q.c ? '<span class="tag">' + (q.n ? esc(q.n) : 'Given') + '</span>' : '') +
        (q.c ? '<svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '');
      if (ctx.canEdit) {
        h += '<li><button type="button" class="' + cls + '" data-i="' + i + '" style="--c:' + col + '" aria-label="' + money(q.a) + ' square, ' + (q.c ? 'given' : 'open') + '">' + inner + '</button></li>';
      } else {
        h += '<li><div class="' + cls + '" style="--c:' + col + '">' + inner + '<span class="sr">' + (q.c ? ' given' : ' open') + '</span></div></li>';
      }
    });
    h += '</ul><p class="legend"><span class="key open"></span> Open <span class="key given"></span> Given</p></section>';

    h += ownerPanel();

    h += '<section class="card give"><h2>Give with Cash App</h2><div class="give-in">' +
      '<img class="qr" src="' + QR + '" alt="Cash App QR code for ' + esc(CASHTAG) + '" width="200" height="200">' +
      '<div class="give-txt"><p class="muted">Scan the code, or send to</p>' +
      '<p class="handle"><strong>' + esc(CASHTAG) + '</strong><span>Amanda Hale</span></p>' +
      '<a class="btn cash" href="' + CASH_URL + '" target="_blank" rel="noopener noreferrer">Open Cash App</a>' +
      '<p class="muted small">Give the exact amount of the square you chose.</p></div></div></section>';

    h += '<footer><p class="verse">“Here am I; send me.” &middot; Isaiah 6:8</p><p>Thank you for your prayers and your support!</p></footer></main>';
    root.innerHTML = h;

    if (firstPaint) { ctx.animated = true; animate(t.raised, pct); }
    if (ctx.canEdit && ctx.selected >= 0) {
      var ed = document.getElementById('editor');
      var inp = document.getElementById('who');
      if (ed && ed.scrollIntoView) ed.scrollIntoView({ block: 'nearest' });
      if (inp) inp.focus();
    }
  }

  function animate(target, pct) {
    var el = document.getElementById('raised');
    var bar = document.getElementById('fill');
    if (!el || !bar) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    void bar.offsetWidth;
    bar.style.width = pct + '%';
    if (reduce || target === 0) { el.textContent = money(target); return; }
    var start = null, dur = 900;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = money(Math.round(target * e));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function commit(next) {
    if (!ctx.artifact) { ctx.msg = 'Saving isn’t available in this view.'; render(); return; }
    next.updated = new Date().toISOString();
    ctx.busy = true; ctx.msg = 'Saving…'; render();
    ctx.artifact.publish(buildDoc(next)).then(function () {
      ctx.msg = 'Saved.';
    }, function (err) {
      ctx.busy = false;
      var code = err && err.code;
      if (code === 'conflict') ctx.msg = 'The page was just updated. Reloading.';
      else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled' || code === 'consent_required') { ctx.canEdit = false; ctx.msg = ''; }
      else if (code === 'rate_limited') ctx.msg = 'Too many saves in a row. Wait a moment and try again.';
      else ctx.msg = 'Couldn’t save. Please try again.';
      render();
    });
  }

  root.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-i],[data-act]') : null;
    if (!t || ctx.busy || !ctx.canEdit) return;
    if (t.hasAttribute('data-i')) { ctx.selected = parseInt(t.getAttribute('data-i'), 10); ctx.msg = ''; render(); return; }
    var act = t.getAttribute('data-act');
    var i = ctx.selected;
    if (act === 'cancel') { ctx.selected = -1; ctx.msg = ''; render(); return; }
    var next = JSON.parse(JSON.stringify(state));
    var whoEl = document.getElementById('who');
    var who = clean(whoEl ? whoEl.value : '');
    if (act === 'give' && i >= 0) { next.squares[i].c = true; next.squares[i].n = who; ctx.selected = -1; commit(next); }
    else if (act === 'save-name' && i >= 0) { next.squares[i].n = who; ctx.selected = -1; commit(next); }
    else if (act === 'reopen' && i >= 0) { next.squares[i].c = false; next.squares[i].n = ''; ctx.selected = -1; commit(next); }
    else if (act === 'save-other') {
      var otherEl = document.getElementById('other');
      var v = parseInt(otherEl ? otherEl.value : '', 10);
      if (isNaN(v) || v < 0 || v > 100000) { ctx.msg = 'Enter a whole dollar amount.'; render(); return; }
      next.other = v; commit(next);
    }
  });

  render();

  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) {
      ctx.artifact = a;
      if (!a) return false;
      return window.claude.use('user').then(function (u) { return u ? u.canEdit() : false; });
    }).then(function (ok) {
      if (ok) { ctx.canEdit = true; render(); }
    }).catch(function () {});
  }
})();
</script>

</html>
